name: Verify high-resolution localized website

on:
  push:
    branches: [website-i18n]
    paths:
      - .github/workflows/verify-highres.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify protected authentication sources
        run: node scripts/verify-auth.mjs

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot verifier
        run: python -m pip install -r scripts/requirements-screenshots.txt

      - name: Verify 185 high-resolution assets
        run: python scripts/generate-screenshots.py --check

      - name: Re-verify protected authentication sources
        run: node scripts/verify-auth.mjs
