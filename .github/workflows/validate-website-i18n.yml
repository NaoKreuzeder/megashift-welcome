name: Validate website-i18n

on:
  push:
    branches: [website-i18n]
    paths:
      - .github/validate-i18n-trigger

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website-i18n
        uses: actions/checkout@v4
        with:
          ref: website-i18n

      - name: Verify protected authentication files before build
        run: node scripts/verify-auth.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Re-verify protected authentication files
        run: node scripts/verify-auth.mjs

      - name: Verify screenshot asset count
        run: |
          count=$(find public/images/screenshots -type f -name '*.webp' | wc -l)
          test "$count" -eq 185
          echo "PASS: $count localized WebP assets"
